<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1000" width="1760" height="1000" role="img" aria-labelledby="t d"><title id="t">Figure 1. Flow capacity under six removal orders</title><desc id="d">Figure 1. Line chart of sensory-to-motor flow capacity retained, from 100% down, as cell types are removed from 0% to 50%. All five targeted orders fall steeply and cross the dashed half line early; random removal, the mean of 30 trials with a narrow band, falls slowly and ends near 23%. Fractions removed when flow first halves: weighted out-degree 4.1%, betweenness 9.0%, sensory-motor betweenness 9.6%, weighted in-degree 13.9%, pagerank 18.7%, random 28.3%.</desc><rect width="1760" height="1000" rx="16" fill="#f3f5f5"/><text x="64" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#0e1214" font-weight="700" style="font-variant-numeric:tabular-nums">Sensory-to-motor flow capacity as cell types are removed</text><text x="64" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#444e53" style="font-variant-numeric:tabular-nums">Batches of 1% of the remaining types, scores recomputed before each batch. Random: 30 trials, mean and 95% band.</text><text x="64" y="190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#444e53" style="font-variant-numeric:tabular-nums">Flow capacity retained</text><path d="M150 691L1110 691" stroke="#d3d9db" stroke-width="1" fill="none"/><path d="M150 532L1110 532" stroke="#d3d9db" stroke-width="1" fill="none"/><path d="M150 373L1110 373" stroke="#d3d9db" stroke-width="1" fill="none"/><path d="M150 214L1110 214" stroke="#d3d9db" stroke-width="1" fill="none"/><path d="M142 850L150 850" stroke="#7b868b" stroke-width="2" fill="none"/><text x="134" y="859" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue',