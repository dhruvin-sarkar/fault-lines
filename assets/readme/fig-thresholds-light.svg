<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 730" width="1760" height="730" role="img" aria-labelledby="t d"><title id="t">Figure 2. Critical removal fractions</title><desc id="d">Figure 2. Dot plot of the fraction of cell types removed when flow capacity first halves. weighted out-degree 4.1%, betweenness 9.0%, sensory-motor betweenness 9.6%, weighted in-degree 13.9%, pagerank 18.7%. Random removal: 30 trials between 25.5% and 31.3%, mean 28.3% with a 95% CI of 27.7% to 28.9%, shaded across every row. Every targeted order lies left of the interval; random removal needs 6.9 times as many types as weighted out-degree.</desc><rect width="1760" height="730" rx="16" fill="#f3f5f5"/><text x="64" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#0e1214" font-weight="700" style="font-variant-numeric:tabular-nums">Share of cell types removed when flow capacity halves</text><text x="64" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#444e53" style="font-variant-numeric:tabular-nums">Targeted orders are single deterministic runs. Random: each tick is one of 30 trials, with the mean and its 95% CI.</text><rect x="1154.8" y="210" width="23.2" height="394" fill="#868f94" fill-opacity="0.25"/><path d="M600 210L600 604" stroke="#d3d9db" stroke-width="1" fill="none"/><path d="M600 604L600 612" stroke="#7b868b" stroke-width="2" fill="none"/><text x="600" y="642" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#444e53" text-anchor="middle" style="font-variant-numeric:tabular-nums">0%</text><path d="M700 210L700 604" stroke="#d3d9db" stroke-width="1" fill="none"/><path d="M700 604L700 612" stroke="#7b868b" stroke-width="2" fill="none"/><text x="700" y="642" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fo